  <text x="242" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#e5e7eb">Frontend (NGINX)</text>
  <text x="242" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a1aab5">Static HTML, Tailwind,</text>
  <text x="242" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a1aab5">Alpine.js</text>
  <text x="242" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a1aab5">Proxies /api to gateway</text>
