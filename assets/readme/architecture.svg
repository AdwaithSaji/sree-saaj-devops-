  <rect x="0.5" y="0.5" width="1239" height="539" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><text x="36" y="44" font-size="13" letter-spacing="3" fill="#a3e635" font-weight="600">RUNTIME ARCHITECTURE</text></g>
  <rect x="36" y="92" width="150" height="110" rx="10" fill="#14181c" stroke="#7d8794" stroke-width="1.8"/>
  <text x="50" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#e5e7eb">Browser</text>
  <text x="50" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a1aab5">Public site</text>
  <text x="50" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a1aab5">Admin dashboard</text>
  <text x="50" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#a1aab5">Staff dashboard</text>
