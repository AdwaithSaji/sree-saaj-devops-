<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 540" width="1240" height="540" role="img" aria-labelledby="t d">
  <title id="t">Runtime architecture</title>
  <desc id="d">Browser to an NGINX frontend, then an API gateway that validates JWTs, rate limits and routes to six FastAPI services on ports 8001 to 8006. Each service has its own PostgreSQL database in the docker-compose stack. Prometheus, Grafana and node-exporter provide monitoring in the compose stack.</desc>
